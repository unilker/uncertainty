[package]
name = "uncertainty-project"
description = "Project file format, analysis runner and report generation for Uncertainty Calculations"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
uncertainty-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# PDF reports: pure Rust, no system libraries (report::pdf).
pdf-writer = "0.12"
ttf-parser = { version = "0.25", default-features = false, features = ["std"] }
miniz_oxide = "0.8"

name: Package
# Builds the installable application for Windows, Linux, Android, macOS and
# iOS (unsigned) and uploads the packages as workflow artifacts. Runs for release tags, on
# demand (Actions → Package → Run workflow) and when the packaging or the
# engine interface changes.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - "app/android/**"
      - "app/linux/**"
      - "app/windows/**"
      - "app/macos/**"
      - "app/ios/**"
      - "app/tool/build_engine_apple.sh"
      - "app/lib/src/engine.dart"
      - "app/pubspec.yaml"
      - "ffi/**"
      - ".github/workflows/package.yml"
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.47.8

jobs:
  windows:
    runs-on: windows-latest
    env:
      HAS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p uncertainty-ffi
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - run: flutter pub get
        working-directory: app
      # The widget tests load target/release/uncertainty_ffi.dll: this checks
      # the engine binding on Windows before packaging.
      - run: flutter test
        working-directory: app
      - run: flutter build windows --release
        working-directory: app
      # Authenticode signature of the executables, when the repository has the
      # secrets WINDOWS_CERTIFICATE (a PFX file, base64) and
      # WINDOWS_CERTIFICATE_PASSWORD; otherwise the package stays unsigned.
      # See docs/windows-code-signing.md.
      - name: Sign (Authenticode)
        if: env.HAS_CERTIFICATE == 'true'
        shell: pwsh
        env:
          CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'certificate.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERTIFICATE))
          $signtool = (Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' | Sort-Object FullName | Select-Object -Last 1).FullName
          $files = Get-ChildItem app/build/windows/x64/runner/Release -Recurse -Include *.exe,*.dll | ForEach-Object { $_.FullName }
          & $signtool sign /f $pfx /p $env:CERTIFICATE_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /d "Uncertainty Calculations" $files
          $status = $LASTEXITCODE
          Remove-Item $pfx
          if ($status -ne 0) { exit $status }
      - name: Archive
        shell: pwsh
        run: Compress-Archive -Path app/build/windows/x64/runner/Release/* -DestinationPath uncertainty-calculations-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: uncertainty-calculations-windows-x64
          path: uncertainty-calculations-windows-x64.zip

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - run: flutter build linux --release
        working-directory: app
      - run: tar -czf uncertainty-calculations-linux-x64.tar.gz -C app/build/linux/x64/release bundle
      - uses: actions/upload-artifact@v4
        with:
          name: uncertainty-calculations-linux-x64
          path: uncertainty-calculations-linux-x64.tar.gz

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
      # The Gradle task buildEngine cross-compiles the engine for every ABI
      # with the NDK (installed by the Android Gradle plugin if missing).
      - run: flutter build apk --release
        working-directory: app
      - run: cp app/build/app/outputs/flutter-apk/app-release.apk uncertainty-calculations-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: uncertainty-calculations-android
          path: uncertainty-calculations-android.apk

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      # Dynamic library for the widget tests, static universal library for the application.
      - run: cargo build --release -p uncertainty-ffi
      - run: app/tool/build_engine_apple.sh macos
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - run: flutter pub get
        working-directory: app
      - run: flutter test
        working-directory: app
      - run: flutter build macos --release
        working-directory: app
      - name: Check that the engine is linked and exported
        run: |
          app=app/build/macos/Build/Products/Release/uncertainty_app.app
          lipo -info "$app/Contents/MacOS/uncertainty_app"
          xcrun objdump --macho --exports-trie "$app/Contents/MacOS/uncertainty_app" | tee exports.txt | grep -E "_uc_(version|template|validate|evaluate|free)$"
          test "$(grep -cE '_uc_(version|template|validate|evaluate|free)$' exports.txt)" = 5
      - run: ditto -c -k --keepParent app/build/macos/Build/Products/Release/uncertainty_app.app uncertainty-calculations-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: uncertainty-calculations-macos
          path: uncertainty-calculations-macos.zip

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios
      - run: app/tool/build_engine_apple.sh ios
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - run: flutter pub get
        working-directory: app
      # Unsigned device build: signing and distribution need the developer account.
      - run: flutter build ios --release --no-codesign
        working-directory: app
      - name: Check that the engine is linked and exported
        run: |
          bin=app/build/ios/iphoneos/Runner.app/Runner
          xcrun objdump --macho --exports-trie "$bin" | tee exports.txt | grep -E "_uc_(version|template|validate|evaluate|free)$"
          test "$(grep -cE '_uc_(version|template|validate|evaluate|free)$' exports.txt)" = 5
      - run: ditto -c -k --keepParent app/build/ios/iphoneos/Runner.app uncertainty-calculations-ios-unsigned.zip
      - uses: actions/upload-artifact@v4
        with:
          name: uncertainty-calculations-ios-unsigned
          path: uncertainty-calculations-ios-unsigned.zip
